<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 900" fill="none">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-l" x="-200%" y="-5%" width="500%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-m" x="-300%" y="-5%" width="700%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-100%" y="-5%" width="300%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blade-glow" x="-200%" y="-2%" width="500%" height="104%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shine gradient along blade -->
    <linearGradient id="blade-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0e8"/>
      <stop offset="8%" stop-color="#0f0f1e"/>
      <stop offset="92%" stop-color="#0c0c1c"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- ═══════════ BLADE ═══════════ -->
  <g id="blade">
    <!-- Main blade body — dark steel -->
    <polygon points="80,15 76,28 69,640 91,640 84,28" fill="#0f0f1e"/>
    <!-- Right-half lighter (ha side) -->
    <polygon points="80,18 84,28 91,640 83,640" fill="#181828"/>
    <!-- Left half darker (mune spine) -->
    <polygon points="80,18 76,28 69,640 77,640" fill="#090912"/>
    <!-- Fuller groove (center shadow line) -->
    <line x1="79" y1="35" x2="79" y2="625" stroke="#07070f" stroke-width="2.5"/>
    <!-- Secondary highlight line (diffuse) -->
    <line x1="82" y1="30" x2="82" y2="632" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

    <!-- ── Kissaki (tip section) ── -->
    <!-- Tip triangle — grey steel -->
    <polygon points="80,15 76,28 84,28" fill="#c8c8d8"/>
    <!-- Bright edge on tip right side -->
    <polygon points="82,16 84,28 83.5,28" fill="white"/>
    <!-- Yokote line -->
    <line x1="76" y1="28" x2="84" y2="28" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>

    <!-- ── Ha (cutting edge) bright highlight ── -->
    <!-- Outer glowing edge -->
    <polygon points="84,28 87,38 93,640 91,640 88,640" fill="white" filter="url(#blade-glow)"/>
    <!-- Sharp inner edge line -->
    <polygon points="84,28 86,36 92,640 90.5,640" fill="white"/>
    <!-- Bright tip-to-base edge line -->
    <line x1="84.5" y1="28" x2="91.5" y2="635" stroke="white" stroke-width="1" opacity="0.9"/>

    <!-- ── Mune (spine) faint highlight ── -->
    <line x1="70" y1="35" x2="70" y2="635" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  </g>

  <!-- ═══════════ HABAKI (blade collar) ═══════════ -->
  <g id="habaki">
    <polygon points="68,640 92,640 95,668 65,668" fill="#25253a"/>
    <polygon points="69,641 91,641 94,667 66,667" fill="#1c1c2e"/>
    <!-- Collar bands -->
    <line x1="65" y1="650" x2="95" y2="650" stroke="#3a3a52" stroke-width="0.6"/>
    <line x1="65" y1="660" x2="95" y2="660" stroke="#2a2a3e" stroke-width="0.6"/>
    <!-- Right edge highlight -->
    <line x1="92" y1="640" x2="95" y2="668" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Left subtle highlight -->
    <line x1="68" y1="640" x2="65" y2="668" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- ═══════════ TSUBA (guard) ═══════════ -->
  <g id="tsuba">
    <!-- Outer shadow ring -->
    <ellipse cx="80" cy="692" rx="46" ry="24" fill="#111120"/>
    <!-- Main body -->
    <ellipse cx="80" cy="692" rx="42" ry="20" fill="#1e1e32"/>
    <!-- Inner recessed ring -->
    <ellipse cx="80" cy="692" rx="37" ry="15" fill="#161628"/>
    <!-- Inner detail ring -->
    <ellipse cx="80" cy="692" rx="31" ry="10" fill="#1e1e32" stroke="#383855" stroke-width="0.6"/>

    <!-- Four traditional piercings (hitsu-ana style) -->
    <ellipse cx="80" cy="679" rx="7" ry="5" fill="#0a0a14" stroke="#383855" stroke-width="0.5"/>
    <ellipse cx="80" cy="705" rx="7" ry="5" fill="#0a0a14" stroke="#383855" stroke-width="0.5"/>
    <ellipse cx="45" cy="692" rx="4" ry="6" fill="#0a0a14" stroke="#383855" stroke-width="0.5"/>
    <ellipse cx="115" cy="692" rx="4" ry="6" fill="#0a0a14" stroke="#383855" stroke-width="0.5"/>

    <!-- Decorative lines across tsuba face -->
    <line x1="50" y1="688" x2="110" y2="688" stroke="#2a2a42" stroke-width="0.6"/>
    <line x1="50" y1="696" x2="110" y2="696" stroke="#2a2a42" stroke-width="0.6"/>

    <!-- Rim highlight (top arc catches light) -->
    <path d="M40,687 A42,20 0 0,1 120,687" stroke="rgba(255,255,255,0.13)" stroke-width="1.2" fill="none"/>
    <!-- Edge subtle glow -->
    <ellipse cx="80" cy="692" rx="42" ry="20" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Seppa spacers -->
  <ellipse cx="80" cy="714" rx="15" ry="6" fill="#252538"/>
  <ellipse cx="80" cy="714" rx="13" ry="4" fill="#1c1c2e"/>

  <!-- ═══════════ TSUKA (handle/grip) ═══════════ -->
  <g id="tsuka">
    <!-- Outer handle shape (slight taper toward kashira) -->
    <polygon points="65,720 95,720 97,892 63,892" fill="#0d0d18"/>
    <!-- Inner fill -->
    <polygon points="66,721 94,721 96,891 64,891" fill="#111122"/>

    <!-- Tsuka-ito (wrap) — diagonal cross pattern -->
    <!-- /// direction -->
    <line x1="63" y1="728" x2="97" y2="746" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="746" x2="97" y2="764" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="764" x2="97" y2="782" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="782" x2="97" y2="800" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="800" x2="97" y2="818" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="818" x2="97" y2="836" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="836" x2="97" y2="854" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="854" x2="97" y2="872" stroke="#232336" stroke-width="3.5"/>
    <line x1="63" y1="872" x2="97" y2="890" stroke="#232336" stroke-width="3.5"/>
    <!-- \\\ direction (counter) -->
    <line x1="97" y1="728" x2="63" y2="746" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="746" x2="63" y2="764" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="764" x2="63" y2="782" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="782" x2="63" y2="800" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="800" x2="63" y2="818" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="818" x2="63" y2="836" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="836" x2="63" y2="854" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="854" x2="63" y2="872" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="97" y1="872" x2="63" y2="890" stroke="#1a1a2a" stroke-width="2"/>

    <!-- Menuki ornaments (bumps under wrap) -->
    <ellipse cx="80" cy="764" rx="8" ry="11" fill="#181828" stroke="#343450" stroke-width="0.6"/>
    <ellipse cx="80" cy="856" rx="8" ry="11" fill="#181828" stroke="#343450" stroke-width="0.6"/>

    <!-- Handle edge highlights -->
    <line x1="65" y1="720" x2="63" y2="892" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <line x1="95" y1="720" x2="97" y2="892" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </g>

  <!-- ═══════════ KASHIRA (pommel) ═══════════ -->
  <g id="kashira">
    <ellipse cx="80" cy="898" rx="26" ry="14" fill="#161628" stroke="#383855" stroke-width="0.5"/>
    <ellipse cx="80" cy="898" rx="23" ry="11" fill="#1e1e34"/>
    <ellipse cx="80" cy="898" rx="19" ry="8" fill="#161628"/>
    <path d="M59,895 A23,11 0 0,1 101,895" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
  </g>

  <!-- ═══════════ ENERGY CRACKS / LIGHTNING ═══════════ -->
  <g id="energy-cracks">

    <!-- ── LEFT SIDE CRACKS ── -->

    <!-- L1 — upper blade, major lightning branch -->
    <polyline points="74,110 59,132 68,158 46,185 60,205 32,230 48,250 24,272"
      stroke="white" stroke-width="2" stroke-linejoin="round" fill="none" filter="url(#glow-l)"/>
    <!-- L1 sub-branches -->
    <polyline points="46,185 34,194 20,206" stroke="white" stroke-width="0.9" fill="none" filter="url(#glow-s)" opacity="0.75"/>
    <polyline points="32,230 18,238 8,250" stroke="white" stroke-width="0.8" fill="none" filter="url(#glow-s)" opacity="0.65"/>
    <!-- L1 tip sparks -->
    <line x1="24" y1="272" x2="12" y2="282" stroke="white" stroke-width="1" opacity="0.8"/>
    <line x1="24" y1="272" x2="10" y2="268" stroke="white" stroke-width="0.7" opacity="0.6"/>
    <line x1="24" y1="272" x2="18" y2="285" stroke="white" stroke-width="0.6" opacity="0.5"/>

    <!-- L2 — mid-blade crack -->
    <polyline points="72,340 52,362 62,388 38,415 54,436"
      stroke="white" stroke-width="1.7" stroke-linejoin="round" fill="none" filter="url(#glow-l)"/>
    <!-- L2 sub-branch -->
    <polyline points="38,415 22,425 12,440" stroke="white" stroke-width="0.8" fill="none" filter="url(#glow-s)" opacity="0.6"/>
    <!-- L2 tip sparks -->
    <line x1="54" y1="436" x2="40" y2="448" stroke="white" stroke-width="0.9" opacity="0.7"/>
    <line x1="54" y1="436" x2="36" y2="436" stroke="white" stroke-width="0.7" opacity="0.55"/>

    <!-- L3 — lower blade crack, slightly dimmer -->
    <polyline points="71,520 48,544 58,572 32,598 46,618"
      stroke="white" stroke-width="1.5" stroke-linejoin="round" fill="none" opacity="0.85" filter="url(#glow-l)"/>
    <!-- L3 sub-branch -->
    <polyline points="32,598 16,608 6,622" stroke="white" stroke-width="0.7" fill="none" filter="url(#glow-s)" opacity="0.5"/>

    <!-- ── RIGHT SIDE CRACKS ── -->

    <!-- R1 — upper blade, major opposite branch -->
    <polyline points="86,82 102,106 92,132 116,158 103,178 130,204 114,225 142,248"
      stroke="white" stroke-width="2" stroke-linejoin="round" fill="none" filter="url(#glow-l)"/>
    <!-- R1 sub-branches -->
    <polyline points="116,158 132,166 148,158" stroke="white" stroke-width="0.9" fill="none" filter="url(#glow-s)" opacity="0.75"/>
    <polyline points="130,204 146,212 156,204" stroke="white" stroke-width="0.8" fill="none" filter="url(#glow-s)" opacity="0.65"/>
    <!-- R1 tip sparks -->
    <line x1="142" y1="248" x2="154" y2="258" stroke="white" stroke-width="1" opacity="0.8"/>
    <line x1="142" y1="248" x2="156" y2="243" stroke="white" stroke-width="0.7" opacity="0.6"/>
    <line x1="142" y1="248" x2="150" y2="262" stroke="white" stroke-width="0.6" opacity="0.5"/>

    <!-- R2 — mid-blade opposite crack -->
    <polyline points="88,290 112,314 100,338 126,366 110,388 136,412"
      stroke="white" stroke-width="1.7" stroke-linejoin="round" fill="none" filter="url(#glow-l)"/>
    <!-- R2 sub-branch -->
    <polyline points="126,366 144,374 156,362" stroke="white" stroke-width="0.8" fill="none" filter="url(#glow-s)" opacity="0.6"/>
    <!-- R2 tip sparks -->
    <line x1="136" y1="412" x2="150" y2="420" stroke="white" stroke-width="0.9" opacity="0.7"/>
    <line x1="136" y1="412" x2="152" y2="406" stroke="white" stroke-width="0.7" opacity="0.55"/>

    <!-- R3 — lower blade opposite crack -->
    <polyline points="88,468 114,492 102,518 128,545 114,565"
      stroke="white" stroke-width="1.5" stroke-linejoin="round" fill="none" opacity="0.85" filter="url(#glow-l)"/>
    <!-- R3 sub-branch -->
    <polyline points="128,545 146,554 156,544" stroke="white" stroke-width="0.7" fill="none" filter="url(#glow-s)" opacity="0.5"/>
  </g>
</svg>
